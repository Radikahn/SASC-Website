name: actuary

services:
  actuary_sjsu:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    # Never pull from a registry, and never reuse a stale local image:
    # every `up` rebuilds from the Dockerfile. This is what replaces the
    # old `just rebuild` (down && docker rmi && up) dance.
    pull_policy: build
    image: actuary-actuary_sjsu
    container_name: actuary
    ports:
      - '4040:4040'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4040'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:4040/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
